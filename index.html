<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart旅費規程</title>
  
  <!-- ファビコン設定 -->
  <link rel="icon" href="https://spc-jp.github.io/smart-ryohikitei/favicon.png" type="image/png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome (アイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (ブラウザでのJSXコンパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }
    @media print {
      .no-print { display: none !important; }
      .print-area { width: 100% !important; margin: 0 !important; padding: 0 !important; border: none !important; box-shadow: none !important; }
    }
    /* スムーズなメニュー開閉用 */
    .sidebar-transition {
      transition: transform 0.3s ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('generator');
      const [isMenuOpen, setIsMenuOpen] = useState(false);

      // 役職別の旅費規程設定（初期値）
      const [rules, setRules] = useState([
        { id: 1, role: '社長', dailyAllowance: 10000, lodging: 15000, headcount: 1, avgTripsPerYear: 12 },
        { id: 2, role: '役員', dailyAllowance: 8000, lodging: 12000, headcount: 2, avgTripsPerYear: 10 },
        { id: 3, role: '部長', dailyAllowance: 5000, lodging: 10000, headcount: 3, avgTripsPerYear: 5 },
        { id: 4, role: '一般', dailyAllowance: 3000, lodging: 8000, headcount: 10, avgTripsPerYear: 3 },
      ]);

      // 出張申請の履歴
      const [applications, setApplications] = useState([
        { id: 1, date: '2026-05-01', applicant: '山田 太郎', role: '部長', destination: '大阪', days: 2, status: '承認済' },
        { id: 2, date: '2026-05-03', applicant: '鈴木 一郎', role: '一般', destination: '福岡', days: 3, status: '申請中' },
      ]);

      // 画面遷移時にメニューを閉じる
      useEffect(() => {
        setIsMenuOpen(false);
      }, [activeTab]);

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard':
            return <Dashboard rules={rules} />;
          case 'settings':
            return <RuleSettings rules={rules} setRules={setRules} />;
          case 'generator':
            return <DocumentGenerator rules={rules} />;
          case 'application':
            return <ExpenseApplication rules={rules} applications={applications} setApplications={setApplications} />;
          default:
            return <Dashboard rules={rules} />;
        }
      };

      return (
        <div className="flex h-screen bg-gray-50 overflow-hidden">
          
          {/* モバイル用オーバーレイ */}
          {isMenuOpen && (
            <div 
              className="fixed inset-0 bg-black/50 z-40 lg:hidden"
              onClick={() => setIsMenuOpen(false)}
            ></div>
          )}

          {/* サイドバー */}
          <aside className={`
            fixed lg:relative inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-50 no-print sidebar-transition
            ${isMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}
          `}>
            <div className="p-6 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <i className="fas fa-plane text-3xl text-amber-400"></i>
                <h1 className="text-xl font-bold tracking-wider">Smart旅費規程</h1>
              </div>
              <button className="lg:hidden text-white" onClick={() => setIsMenuOpen(false)}>
                <i className="fas fa-times text-xl"></i>
              </button>
            </div>
            
            <nav className="flex-1 px-4 space-y-2 mt-4 overflow-y-auto">
              <NavItem 
                icon={<i className="fas fa-chart-pie text-lg w-6 text-center"></i>} 
                label="ダッシュボード" 
                isActive={activeTab === 'dashboard'} 
                onClick={() => setActiveTab('dashboard')} 
              />
              <NavItem 
                icon={<i className="fas fa-cog text-lg w-6 text-center"></i>} 
                label="金額・シミュレーション" 
                isActive={activeTab === 'settings'} 
                onClick={() => setActiveTab('settings')} 
              />
              <NavItem 
                icon={<i className="fas fa-magic text-lg w-6 text-center"></i>} 
                label="規程書ジェネレーター" 
                isActive={activeTab === 'generator'} 
                onClick={() => setActiveTab('generator')} 
              />
              <NavItem 
                icon={<i className="fas fa-file-alt text-lg w-6 text-center"></i>} 
                label="出張申請・精算" 
                isActive={activeTab === 'application'} 
                onClick={() => setActiveTab('application')} 
              />
            </nav>
            
            <div className="p-4 m-4 bg-slate-800 rounded-lg">
              <p className="text-xs text-slate-400">ログイン中</p>
              <div className="flex items-center space-x-2 mt-1">
                <div className="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
                  <i className="fas fa-building text-sm"></i>
                </div>
                <span className="text-sm font-medium">株式会社サンプル</span>
              </div>
            </div>
          </aside>

          {/* メインコンテンツ */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header className="bg-white shadow-sm px-4 lg:px-8 py-4 no-print flex items-center">
              <button 
                className="lg:hidden p-2 mr-3 text-gray-600 hover:bg-gray-100 rounded-md"
                onClick={() => setIsMenuOpen(true)}
              >
                <i className="fas fa-bars text-xl"></i>
              </button>
              <h2 className="text-lg lg:text-2xl font-semibold text-gray-800 truncate">
                {activeTab === 'dashboard' && '節税シミュレーション'}
                {activeTab === 'settings' && '旅費規程のカスタマイズ'}
                {activeTab === 'generator' && '規程書ジェネレーター'}
                {activeTab === 'application' && '出張旅費の申請・精算'}
              </h2>
            </header>
            
            <main className="flex-1 overflow-auto p-4 lg:p-8">
              <div className="max-w-7xl mx-auto">
                {renderContent()}
              </div>
            </main>
          </div>
        </div>
      );
    }

    function NavItem({ icon, label, isActive, onClick }) {
      return (
        <button
          onClick={onClick}
          className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors duration-200 ${
            isActive 
              ? 'bg-blue-600 text-white shadow-md' 
              : 'text-slate-300 hover:bg-slate-800 hover:text-white'
          }`}
        >
          {icon}
          <span className="font-medium whitespace-nowrap">{label}</span>
        </button>
      );
    }

    // ==========================================
    // 旅費規程書ジェネレーター
    // ==========================================
    function DocumentGenerator({ rules }) {
      const [formData, setFormData] = useState({
        companyName: '株式会社サンプル',
        effectiveDate: '2026年6月1日',
        distanceThreshold: '100',
        timeThreshold: '5',
        greenCarRole: '役員',
      });

      const handleChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 h-full">
          
          {/* 左カラム：ヒアリングフォーム */}
          <div className="lg:col-span-4 space-y-6 no-print">
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
              <div className="flex items-center space-x-2 mb-6 pb-4 border-b border-gray-100">
                <i className="fas fa-magic text-purple-500 text-2xl"></i>
                <h3 className="text-lg font-bold text-gray-800">かんたんヒアリング</h3>
              </div>

              <form className="space-y-5">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">Q1. 会社名</label>
                  <input 
                    type="text" 
                    value={formData.companyName}
                    onChange={e => handleChange('companyName', e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none text-sm"
                  />
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">Q2. 施行日</label>
                  <input 
                    type="text" 
                    value={formData.effectiveDate}
                    onChange={e => handleChange('effectiveDate', e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none text-sm"
                  />
                </div>

                <div className="bg-purple-50 p-4 rounded-lg border border-purple-100">
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Q3. 「出張」の基準</label>
                  <div className="space-y-3">
                    <div className="flex items-center justify-between text-xs sm:text-sm">
                      <span>片道の距離が</span>
                      <div className="flex items-center">
                        <input 
                          type="number" 
                          value={formData.distanceThreshold}
                          onChange={e => handleChange('distanceThreshold', e.target.value)}
                          className="w-16 sm:w-20 px-2 py-1 border border-gray-300 rounded-md text-right mx-2 outline-none"
                        />
                        <span>km 以上</span>
                      </div>
                    </div>
                    <div className="flex items-center justify-between text-xs sm:text-sm">
                      <span>または移動時間が</span>
                      <div className="flex items-center">
                        <input 
                          type="number" 
                          value={formData.timeThreshold}
                          onChange={e => handleChange('timeThreshold', e.target.value)}
                          className="w-12 sm:w-16 px-2 py-1 border border-gray-300 rounded-md text-right mx-2 outline-none"
                        />
                        <span>時間 以上</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">Q4. グリーン車利用役職</label>
                  <select 
                    value={formData.greenCarRole}
                    onChange={e => handleChange('greenCarRole', e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none text-sm"
                  >
                    {rules.map(r => (
                      <option key={r.id} value={r.role}>{r.role} 以上</option>
                    ))}
                    <option value="利用不可">全員利用不可</option>
                  </select>
                </div>
              </form>
            </div>
          </div>

          {/* 右カラム：Word風プレビュー */}
          <div className="lg:col-span-8 flex flex-col h-full overflow-hidden">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 no-print">
              <h3 className="text-gray-600 font-medium flex items-center">
                <i className="fas fa-file-alt mr-2"></i>
                規程書プレビュー
              </h3>
              <div className="flex space-x-2 w-full sm:w-auto">
                <button 
                  onClick={() => window.print()}
                  className="flex-1 sm:flex-none flex items-center justify-center px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 shadow-sm"
                >
                  <i className="fas fa-print mr-2 text-gray-600"></i>
                  印刷
                </button>
                <button className="flex-1 sm:flex-none flex items-center justify-center px-3 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm">
                  <i className="fas fa-download mr-2"></i>
                  Word出力
                </button>
              </div>
            </div>

            {/* 用紙コンテナ */}
            <div className="bg-white shadow-md border border-gray-200 rounded-sm p-6 sm:p-12 overflow-y-auto print-area" style={{ minHeight: '600px' }}>
              <div className="max-w-3xl mx-auto font-serif text-gray-800 space-y-6 sm:space-y-8">
                
                <h1 className="text-xl sm:text-2xl font-bold text-center tracking-widest mb-6 sm:mb-10 border-b-2 border-gray-800 pb-4">
                  出張旅費規程
                </h1>

                <div className="space-y-4 sm:space-y-6 text-xs sm:text-sm leading-relaxed">
                  <section>
                    <h2 className="font-bold text-base sm:text-lg mb-2">第1条（目的）</h2>
                    <p>
                      本規程は、{formData.companyName}（以下「会社」という）の役員及び従業員が、会社の業務の必要により出張する場合における旅費の支給基準等、必要な事項を定めることを目的とする。
                    </p>
                  </section>

                  <section>
                    <h2 className="font-bold text-base sm:text-lg mb-2">第2条（出張の定義）</h2>
                    <p>
                      本規程において「出張」とは、通常の勤務地を離れ、次に掲げる基準のいずれかを満たす地域へ業務の目的で赴くことをいう。
                    </p>
                    <ul className="list-decimal pl-6 mt-2 space-y-1">
                      <li>片道の移動距離が {formData.distanceThreshold}km 以上であること</li>
                      <li>片道の移動時間が {formData.timeThreshold}時間 以上であること</li>
                    </ul>
                  </section>

                  <section>
                    <h2 className="font-bold text-base sm:text-lg mb-2">第3条（旅費の種類）</h2>
                    <p>
                      旅費は、交通費、宿泊費及び日当の3種類とし、その支給額は別表「旅費支給基準表」に定めるところによる。
                    </p>
                  </section>

                  {/* 別表：スマホでの表示を考慮したスクロール可能テーブル */}
                  <div className="mt-8 pt-8 border-t border-gray-200 overflow-x-auto">
                    <h2 className="font-bold text-base sm:text-lg text-center mb-4">別表：旅費支給基準表</h2>
                    <table className="w-full border-collapse border border-gray-800 min-w-[300px]">
                      <thead>
                        <tr className="bg-gray-100 text-[10px] sm:text-xs">
                          <th className="border border-gray-800 py-1 sm:py-2 px-1 sm:px-4 text-center">役職</th>
                          <th className="border border-gray-800 py-1 sm:py-2 px-1 sm:px-4 text-center">日当</th>
                          <th className="border border-gray-800 py-1 sm:py-2 px-1 sm:px-4 text-center">宿泊費</th>
                        </tr>
                      </thead>
                      <tbody>
                        {rules.map(rule => (
                          <tr key={rule.id} className="text-[10px] sm:text-sm">
                            <td className="border border-gray-800 py-1 sm:py-2 px-1 sm:px-4 text-center font-medium">{rule.role}</td>
                            <td className="border border-gray-800 py-1 sm:py-2 px-1 sm:px-4 text-right whitespace-nowrap">{rule.dailyAllowance.toLocaleString()} 円</td>
                            <td className="border border-gray-800 py-1 sm:py-2 px-1 sm:px-4 text-right whitespace-nowrap">{rule.lodging.toLocaleString()} 円</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  
                  <div className="mt-12 text-right">
                    <p className="font-bold">附則</p>
                    <p>本規程は、{formData.effectiveDate} より施行する。</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      );
    }

    // ==========================================
    // ダッシュボード
    // ==========================================
    function Dashboard({ rules }) {
      const simulation = useMemo(() => {
        let totalTaxFreeAllowance = 0;
        rules.forEach(rule => {
          const annualDays = rule.avgTripsPerYear * 2; 
          totalTaxFreeAllowance += rule.headcount * annualDays * rule.dailyAllowance;
        });
        const taxSaving = totalTaxFreeAllowance * 0.3;
        const socialInsSaving = totalTaxFreeAllowance * 0.3;
        return {
          allowance: totalTaxFreeAllowance,
          taxSaving: taxSaving,
          socialInsSaving: socialInsSaving
        };
      }, [rules]);

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-amber-500 to-orange-400 rounded-2xl p-6 lg:p-8 text-white shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <span className="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-bold mb-4">
                知らないなんてもったいない！
              </span>
              <h3 className="text-xl lg:text-3xl font-bold mb-2">旅費規程で、手元に資金を残す</h3>
              <p className="text-amber-50 text-sm">設定された規程に基づく現在の年間節税予測です。</p>
            </div>
            <i className="fas fa-coins text-6xl lg:text-[8rem] text-white/40"></i>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6">
            <KpiCard 
              title="年間 予測非課税支給額" 
              amount={`¥${simulation.allowance.toLocaleString()}`} 
              icon={<i className="fas fa-briefcase text-blue-500"></i>}
              color="blue"
            />
            <KpiCard 
              title="年間 法人税等 削減予測" 
              amount={`¥${simulation.taxSaving.toLocaleString()}`} 
              icon={<i className="fas fa-chart-line text-emerald-500"></i>}
              color="emerald"
            />
            <KpiCard 
              title="年間 社会保険料 削減予測" 
              amount={`¥${simulation.socialInsSaving.toLocaleString()}`} 
              icon={<i className="fas fa-check-circle text-purple-500"></i>}
              color="purple"
            />
          </div>

          <div className="bg-white rounded-xl shadow-sm p-4 sm:p-6 border border-gray-100">
            <h4 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">💡 節税のカラクリ</h4>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
              <div>
                <h5 className="font-semibold text-blue-700 mb-1">1. 会社側のメリット</h5>
                <p className="text-gray-600 text-sm leading-relaxed">
                  「出張日当」は旅費交通費として<strong>全額損金算入</strong>できます。利益を圧縮し法人税を削減。さらに実費精算の手間を大幅に削減できます。
                </p>
              </div>
              <div>
                <h5 className="font-semibold text-orange-600 mb-1">2. 個人のメリット</h5>
                <p className="text-gray-600 text-sm leading-relaxed">
                  日当は<strong>非課税所得</strong>。所得税・住民税がかからず、社会保険料の算定基礎にも含まれないため、手残りが増えます。
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function KpiCard({ title, amount, icon, color }) {
      const bgColors = { blue: 'bg-blue-50', emerald: 'bg-emerald-50', purple: 'bg-purple-50' };
      return (
        <div className="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
          <div className="flex justify-between items-start mb-3">
            <h4 className="text-gray-500 font-medium text-xs sm:text-sm">{title}</h4>
            <div className={`p-2 rounded-lg ${bgColors[color]}`}>{icon}</div>
          </div>
          <div className="text-xl sm:text-2xl font-bold text-gray-800 truncate">{amount}</div>
        </div>
      );
    }

    // ==========================================
    // 金額設定
    // ==========================================
    function RuleSettings({ rules, setRules }) {
      const handleChange = (id, field, value) => {
        const numValue = parseInt(value, 10) || 0;
        setRules(rules.map(rule => rule.id === id ? { ...rule, [field]: numValue } : rule));
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div className="p-4 sm:p-6 border-b border-gray-100 bg-gray-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <h3 className="text-lg font-bold text-gray-800">支給額・シミュレーション設定</h3>
            <button className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
              設定を保存
            </button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse min-w-[700px]">
              <thead>
                <tr className="bg-gray-50 text-gray-600 text-xs border-b">
                  <th className="p-4 font-semibold">役職</th>
                  <th className="p-4 font-semibold">日当(1日)</th>
                  <th className="p-4 font-semibold">宿泊費(1泊)</th>
                  <th className="p-4 font-semibold text-gray-400">対象人数</th>
                  <th className="p-4 font-semibold text-gray-400">年間出張数</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {rules.map((rule) => (
                  <tr key={rule.id} className="hover:bg-gray-50/50">
                    <td className="p-4 font-medium text-gray-800">{rule.role}</td>
                    <td className="p-4">
                      <div className="relative">
                        <span className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">¥</span>
                        <input type="number" value={rule.dailyAllowance} onChange={(e) => handleChange(rule.id, 'dailyAllowance', e.target.value)} className="w-24 pl-5 pr-2 py-1 border rounded-md text-sm outline-none" />
                      </div>
                    </td>
                    <td className="p-4">
                      <div className="relative">
                        <span className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">¥</span>
                        <input type="number" value={rule.lodging} onChange={(e) => handleChange(rule.id, 'lodging', e.target.value)} className="w-24 pl-5 pr-2 py-1 border rounded-md text-sm outline-none" />
                      </div>
                    </td>
                    <td className="p-4 text-sm text-gray-500">
                      <input type="number" value={rule.headcount} onChange={(e) => handleChange(rule.id, 'headcount', e.target.value)} className="w-12 px-1 py-1 border rounded-md text-center" /> 人
                    </td>
                    <td className="p-4 text-sm text-gray-500">
                      <input type="number" value={rule.avgTripsPerYear} onChange={(e) => handleChange(rule.id, 'avgTripsPerYear', e.target.value)} className="w-12 px-1 py-1 border rounded-md text-center" /> 回
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // 出張申請
    // ==========================================
    function ExpenseApplication({ rules, applications, setApplications }) {
      const [formData, setFormData] = useState({ applicant: '', role: rules[0].role, destination: '', days: 1, transportationCost: 0 });

      const currentRule = rules.find(r => r.role === formData.role) || rules[0];
      const calculatedDaily = currentRule.dailyAllowance * formData.days;
      const calculatedLodging = currentRule.lodging * (formData.days > 1 ? formData.days - 1 : 0);
      const totalAmount = calculatedDaily + calculatedLodging + (parseInt(formData.transportationCost) || 0);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.applicant || !formData.destination) return;
        const newApp = { id: Date.now(), date: new Date().toISOString().split('T')[0], applicant: formData.applicant, role: formData.role, destination: formData.destination, days: formData.days, status: '申請中' };
        setApplications([newApp, ...applications]);
        setFormData({ ...formData, applicant: '', destination: '', days: 1, transportationCost: 0 });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
          <div className="lg:col-span-2 space-y-6">
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 sm:p-6">
              <h3 className="text-lg font-bold text-gray-800 mb-6 flex items-center">
                <i className="fas fa-plane mr-2 text-blue-500"></i> 新規申請
              </h3>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">氏名</label>
                    <input type="text" value={formData.applicant} onChange={e => setFormData({...formData, applicant: e.target.value})} className="w-full px-3 py-2 border rounded-lg outline-none text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">役職</label>
                    <select value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full px-3 py-2 border rounded-lg outline-none text-sm bg-white">
                      {rules.map(r => <option key={r.id} value={r.role}>{r.role}</option>)}
                    </select>
                  </div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1 text-sm">目的地</label>
                    <input type="text" value={formData.destination} onChange={e => setFormData({...formData, destination: e.target.value})} className="w-full px-3 py-2 border rounded-lg outline-none text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">日数</label>
                    <input type="number" min="1" value={formData.days} onChange={e => setFormData({...formData, days: parseInt(e.target.value) || 1})} className="w-full px-3 py-2 border rounded-lg outline-none text-sm" />
                  </div>
                </div>
                <div className="pt-4 flex justify-end">
                  <button type="submit" className="w-full sm:w-auto bg-blue-600 text-white px-8 py-2 rounded-lg font-bold">申請する</button>
                </div>
              </form>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 overflow-hidden">
              <h3 className="text-lg font-bold text-gray-800 mb-4">履歴</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left min-w-[500px]">
                  <thead>
                    <tr className="text-xs text-gray-400 border-b">
                      <th className="pb-2 font-medium">申請者</th>
                      <th className="pb-2 font-medium">目的地</th>
                      <th className="pb-2 font-medium">日数</th>
                      <th className="pb-2 font-medium">状態</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-50">
                    {applications.map(app => (
                      <tr key={app.id} className="text-sm text-gray-700">
                        <td className="py-3 font-medium">{app.applicant} <span className="text-[10px] text-gray-400">({app.role})</span></td>
                        <td className="py-3">{app.destination}</td>
                        <td className="py-3">{app.days}日</td>
                        <td className="py-3">
                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${app.status === '承認済' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                            {app.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div className="space-y-6">
            <div className="bg-slate-800 rounded-xl shadow-lg p-6 text-white lg:sticky lg:top-6">
              <h3 className="text-lg font-bold mb-4 border-b border-slate-700 pb-3">支給額計算</h3>
              <div className="space-y-3 text-sm">
                <div className="flex justify-between"><span className="text-slate-400">日当</span><span>¥{calculatedDaily.toLocaleString()}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">宿泊費</span><span>¥{calculatedLodging.toLocaleString()}</span></div>
                <div className="pt-3 mt-3 border-t border-slate-700 flex justify-between items-end">
                  <span className="font-bold">合計</span>
                  <span className="text-2xl font-bold text-amber-400">¥{totalAmount.toLocaleString()}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
